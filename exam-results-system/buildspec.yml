version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - # Install dependencies for all lambda functions
      - for dir in src/*/; do if [ -f "${dir}requirements.txt" ]; then pip install -r "${dir}requirements.txt" -t "${dir}"; fi; done
      - # Install Terraform (example, use official installer in real pipeline)
      - wget https://releases.hashicorp.com/terraform/1.3.7/terraform_1.3.7_linux_amd64.zip
      - unzip terraform_1.3.7_linux_amd64.zip
      - mv terraform /usr/local/bin/

  pre_build:
    commands:
      - echo "Running unit tests..."
      # Add unit test commands here, e.g., pytest

  build:
    commands:
      - echo "Synthesizing and deploying Terraform..."
      - cd terraform
      - terraform init -input=false
      # Use TF_WORKSPACE environment variable in CodePipeline to select dev/prod
      - terraform workspace select ${TF_WORKSPACE} || terraform workspace new ${TF_WORKSPACE}
      - terraform apply -var-file="environments/${TF_WORKSPACE}.tfvars" -auto-approve

  post_build:
    commands:
      - echo "Deployment completed on $(date)"