apiVersion: v1
kind: PersistentVolume
metadata:
  name: source-efs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0dd03d3fafa086d7d
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: source-efs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: efs-sc
  volumeName: source-efs-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: target-efs-pv-root
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0cf56687c9ae73aa6
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: target-efs-pvc-root
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: efs-sc
  volumeName: target-efs-pv-root
---
apiVersion: batch/v1
kind: Job
metadata:
  name: efs-copy-job
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: copy-data
        image: alpine:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Starting EFS copy job at $(date)"
          echo "Source EFS contents:"
          ls -la /source/
          echo "Target EFS contents before copy:"
          ls -la /target/
          
          # Create openwebui directory in target
          mkdir -p /target/openwebui
          
          # Copy all data from source to target/openwebui
          cp -r /source/* /target/openwebui/
          
          echo "Copy completed at $(date)"
          echo "Target EFS contents after copy:"
          ls -la /target/openwebui/
          echo "Copy job finished successfully!"
        volumeMounts:
        - name: source-volume
          mountPath: /source
        - name: target-volume
          mountPath: /target
      volumes:
      - name: source-volume
        persistentVolumeClaim:
          claimName: source-efs-pvc
      - name: target-volume
        persistentVolumeClaim:
          claimName: target-efs-pvc-root
