apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-alb-ingress
  namespace: rag-system
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: unified-alb
    
    # Health check configuration
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # SSL/TLS (optional - uncomment if you have ACM certificate)
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/cert-id
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    
spec:
  rules:
  - host: # Leave empty for any host, or specify your domain
    http:
      paths:
      # OpenWebUI - Root path
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openwebui-service
            port:
              number: 80
      
      # RAG System - Path-based routing
      - path: /rag
        pathType: Prefix
        backend:
          service:
            name: rag-frontend-service
            port:
              number: 80
---
# Convert services to ClusterIP (remove LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-service-clusterip
  namespace: rag-system
  labels:
    app: rag-frontend
spec:
  selector:
    app: rag-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-service-clusterip
  namespace: default
  labels:
    app: openwebui
spec:
  selector:
    app: openwebui
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
