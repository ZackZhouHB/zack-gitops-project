apiVersion: v1
kind: Namespace
metadata:
  name: rag
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag
data:
  AWS_REGION: "ap-southeast-2"
  # UPDATE: Get from terraform output: opensearch_endpoint
  OPENSEARCH_ENDPOINT: "REPLACE_WITH_TERRAFORM_OUTPUT"
  # UPDATE: Get from terraform output: documents_bucket
  DOCUMENTS_BUCKET: "rag-cloud-dev-documents-381324498760"
  # UPDATE: Get from terraform output: ingestion_queue_url
  SQS_QUEUE_URL: "https://sqs.ap-southeast-2.amazonaws.com/381324498760/rag-cloud-dev-ingestion"
  DYNAMODB_JOBS_TABLE: "rag-cloud-dev-jobs"
  DYNAMODB_SESSIONS_TABLE: "rag-cloud-dev-sessions"
  COGNITO_USER_POOL_ID: ""
  COGNITO_CLIENT_ID: ""
  REDIS_HOST: "redis-master.rag.svc.cluster.local"
