name: "Zack blog: Hugo build, link check and deploy to GitHub Pages"

on:
  push:
    branches: [editing]
    paths:
      - "blog-site/**"
      - ".github/workflows/hugo-pages.yaml"
  pull_request:
    branches: [editing]
    paths:
      - "blog-site/**"
      - ".github/workflows/hugo-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build:
    name: Build and link check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-site
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Hugo ${{ env.HUGO_VERSION }} (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${BASE_URL:-https://zackblog.work}/"

      # A second build rooted at "/" lets lychee resolve every internal link and image offline.
      - name: Build copy for link check
        run: hugo --gc --baseURL "/" --destination public-check

      - name: Check internal links and images
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/blog-site/public-check
            'blog-site/public-check/**/*.html'
          fail: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: blog-site/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/editing'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
