name: "zack gitops workflow for Django blog"
on: 
  push: 
    branches:
      - editing
    paths:             # any change in folder "zack_blog" 
      - django_project/**   # for both stage and main, will trigger workflow
  
  pull_request:        # no one can commit to main except approvel needed from main branch owner
    branches:          # raise pull_request when merge from stage to main
      - main           # will trigger workflow
    paths:          
      - django_project/**

env:                   # cred for AWS access, terrform is looking for      
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  HOST_NAME: ${{secrets.HOST_NAME}}
  USER_NAME: ${{secrets.USER_NAME}}

jobs: 
  terraform:   # create a ubuntu container, cd to terraform dir, checkout source code
    name: "Zackweb image build CI pipeline"
    runs-on: ubuntu-latest    # from github runners containers 
    defaults:
      run:
        shell: bash
        working-directory: ./django_project
    
    steps:

      - name: SCM checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          IMAGE_NAME=zackz001/zackblog-django
          docker buildx create --use
          docker buildx inspect --bootstrap
          docker build -t zackz001/zackblog-django:test .
          docker tag zackz001/zackblog-django:test zackz001/zackblog-django:v9${{ github.run_number }}  # Replace with your desired tag
          docker tag zackz001/zackblog-django:v9${{ github.run_number }} zackz001/zackblog-django:latest
      - name: Push Docker image newer build
        run: docker push zackz001/zackblog-django:v9${{ github.run_number }}

      - name: Push Docker image latest
        run: docker push zackz001/zackblog-django:latest

      - name: Configure AWS cli on runners
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.HOST_NAME}}
          username: ${{secrets.USER_NAME}}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/zack-gitops-project || { echo "Directory not found! Exiting."; exit 1; }
            git reset --hard origin/editing
            git pull
            sudo chmod -R 755 /home/ubuntu/zack-gitops-project/django_project
            sudo docker pull zackz001/zackblog-django:latest
            sudo docker stop django-blog-container || true
            sudo docker rm django-blog-container || true
            sudo docker run -d --name django-blog-container -p 80:8000 zackz001/zackblog-django:latest