apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
      - name: rag-backend
        image: rag-backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: LLM_BACKEND
          value: "vllm"
        - name: VLLM_URL
          value: "http://llm-server:8000"
        - name: EMBED_BACKEND
          value: "ollama"
        - name: OLLAMA_URL
          value: "http://192.168.50.61:11434"
        - name: EMBED_MODEL
          value: "nomic-embed-text"
        - name: WEAVIATE_URL
          value: "http://weaviate:8080"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_DEFAULT_REGION
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: ai-platform
spec:
  selector:
    app: rag-backend
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
